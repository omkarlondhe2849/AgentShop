server:
  port: ${PORT:8080}

spring:
  application:
    name: agentshop

  # PostgreSQL Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agentshop}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      platform: postgresql

  # Spring AI — OpenAI-compatible (configured for Google Gemini API)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        options:
          model: ${AI_MODEL:gemini-1.5-flash}
          temperature: 0.7
          max-tokens: 2048

# Razorpay Configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TY1pnolzBLW2gj}
  key-secret: ${RAZORPAY_KEY_SECRET:5q0Jvb75Yw8IHeZwnM9w5pF3}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret}

# App Configuration
agentshop:
  max-order-amount: 50000000  # ₹500,000 in paise
  max-discount-percent: 30    # Merchant-configured ceiling — no checkout can exceed this discount %
  currency: INR
  payment-link-expiry-minutes: 30

# SpringDoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.agentshop: DEBUG
    org.springframework.ai: INFO
